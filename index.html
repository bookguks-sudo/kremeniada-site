<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КРЕМЕНИАДА</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<style>
:root{--bg:#070707;--surface:#111;--border:rgba(255,255,255,0.04);--txt:#d8d4d0;--txt2:#777;--lava:#ff5a00}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.6}

/* LAVA */
#lava{position:fixed;inset:0;z-index:0;pointer-events:none}
.granite{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.9;background:radial-gradient(ellipse at 30% 70%,rgba(255,60,0,.12) 0%,transparent 50%),radial-gradient(ellipse at 70% 30%,rgba(255,80,0,.08) 0%,transparent 40%)}
.granite::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}

/* HEADER */
.header{position:fixed;top:0;left:0;width:100%;z-index:100;padding:1rem 2.5rem;display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-20px);transition:all .6s cubic-bezier(.16,1,.3,1)}
.header.vis{opacity:1;transform:translateY(0)}
.header.scrolled{background:rgba(7,7,7,.96);border-bottom:1px solid var(--border);padding:.7rem 2.5rem;backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.logo img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,90,0,.35))}
.logo span{font-family:'Oswald',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:5px;text-transform:uppercase;background:linear-gradient(180deg,#f0f0f0 0%,#bbb 40%,#888 50%,#bbb 60%,#eee 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 2px rgba(0,0,0,.8)) drop-shadow(0 0 10px rgba(255,90,0,.2))}
.nav{display:flex;align-items:center;gap:2rem}
.nav a{font-family:'Oswald',sans-serif;font-size:.75rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--txt2);text-decoration:none;transition:color .25s}
.nav a:hover{color:var(--lava)}
.lang{position:relative}
.lang-btn{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:1px;padding:.3rem .8rem;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--txt2);cursor:pointer;transition:all .25s}
.lang-btn:hover{border-color:var(--lava);color:var(--lava)}
.lang-menu{position:absolute;top:calc(100% + 4px);right:0;background:rgba(10,10,10,.98);border:1px solid var(--border);min-width:70px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:all .2s}
.lang.open .lang-menu{opacity:1;pointer-events:all;transform:translateY(0)}
.lang-menu button{display:block;width:100%;padding:.45rem .8rem;font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:1px;background:none;border:none;color:var(--txt2);cursor:pointer;text-align:left;transition:all .2s}
.lang-menu button:hover{background:rgba(255,90,0,.08);color:var(--lava)}
.lang-menu button.on{color:var(--lava)}

/* HERO */
.hero{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7rem 1.5rem 4rem;text-align:center}
.hero-banner{width:100%;max-width:860px;height:auto;border-radius:2px;box-shadow:0 40px 120px rgba(0,0,0,.9),0 0 50px rgba(255,90,0,.06);opacity:0;transform:scale(.92);transition:all 1.2s cubic-bezier(.16,1,.3,1) .3s}
.hero-banner.vis{opacity:1;transform:scale(1)}
.hero-title{font-family:'Oswald',sans-serif;font-size:clamp(2rem,6vw,4.5rem);font-weight:700;letter-spacing:8px;text-transform:uppercase;line-height:1.05;margin-top:2rem;margin-bottom:.6rem;background:linear-gradient(180deg,#fff 0%,#ddd 30%,#aaa 45%,#ccc 60%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 3px 3px rgba(0,0,0,.9)) drop-shadow(0 0 25px rgba(255,90,0,.25));opacity:0;transform:translateY(30px);transition:all 1s cubic-bezier(.16,1,.3,1) .8s}
.hero-title.vis{opacity:1;transform:translateY(0)}
.hero-sub1{font-family:'Oswald',sans-serif;font-size:clamp(1rem,2.5vw,1.4rem);font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--txt2);margin-bottom:.3rem;opacity:0;transform:translateY(20px);transition:all .9s ease 1.1s}
.hero-sub1.vis{opacity:1;transform:translateY(0)}
.hero-sub2{font-family:'Montserrat',sans-serif;font-size:clamp(.85rem,2vw,1.1rem);font-weight:300;color:var(--txt2);letter-spacing:2px;opacity:0;transform:translateY(20px);transition:all .9s ease 1.3s}
.hero-sub2.vis{opacity:1;transform:translateY(0)}

/* SEASON */
.season{position:relative;z-index:10;max-width:960px;margin:0 auto;padding:2rem 1.5rem 6rem}
.season-label{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--lava);text-align:center;margin-bottom:.5rem}
.season-title{font-family:'Oswald',sans-serif;font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:600;text-transform:uppercase;text-align:center;margin-bottom:3rem;letter-spacing:5px;color:var(--txt2)}
.cards{display:flex;flex-direction:column;gap:2rem}
.card{display:grid;grid-template-columns:38% 62%;background:var(--surface);border:1px solid var(--border);overflow:hidden;cursor:pointer;opacity:0;transform:translateY(50px);transition:border-color .4s,box-shadow .4s,transform .4s}
.card:nth-child(even){grid-template-columns:62% 38%;direction:rtl}
.card:nth-child(even)>*{direction:ltr}
.card:hover{border-color:rgba(255,90,0,.18);box-shadow:0 15px 60px rgba(0,0,0,.5),0 0 40px rgba(255,90,0,.05);transform:translateY(-4px)}
.card-img{position:relative;min-height:220px;overflow:hidden;background:var(--bg)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.card:hover .card-img img{transform:scale(1.06)}
.card-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);opacity:0;transition:opacity .3s}
.card:hover .card-play{opacity:1}
.card-play svg{width:48px;height:48px;fill:var(--lava);filter:drop-shadow(0 0 14px rgba(255,90,0,.6))}
.card-body{padding:1.6rem 2rem;display:flex;flex-direction:column;justify-content:center}
.card-tag{font-family:'Oswald',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--lava);margin-bottom:.5rem}
.card-title{font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:600;text-transform:uppercase;line-height:1.15;margin-bottom:.6rem;letter-spacing:1px}
.card-desc{color:var(--txt2);font-size:.88rem;line-height:1.7}
.card audio{width:100%;margin-top:.8rem;height:34px;filter:invert(1) hue-rotate(180deg) brightness(.85)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.93);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
.modal.open{opacity:1;pointer-events:all}
.modal-box{width:92%;max-width:840px;background:var(--surface);border:1px solid rgba(255,90,0,.15);position:relative;transform:scale(.94);transition:transform .35s;box-shadow:0 0 60px rgba(255,90,0,.06)}
.modal.open .modal-box{transform:scale(1)}
.modal-close{position:absolute;top:-32px;right:0;font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:2px;color:var(--txt2);background:none;border:none;cursor:pointer;text-transform:uppercase}
.modal-close:hover{color:var(--lava)}
.modal-vid{width:100%;aspect-ratio:16/9;background:#000}
.modal-vid iframe{width:100%;height:100%;border:none}
.modal-info{padding:1.3rem 1.8rem}
.modal-info h3{font-family:'Oswald',sans-serif;font-size:1.2rem;text-transform:uppercase;margin-bottom:.3rem;letter-spacing:1px}
.modal-info p{color:var(--txt2);font-size:.87rem;line-height:1.6}

/* FOOTER */
.footer{position:relative;z-index:10;border-top:1px solid var(--border);padding:3rem 1.5rem 2rem;text-align:center}
.footer-glow{position:absolute;top:-1px;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--lava),transparent);box-shadow:0 0 18px var(--lava)}
.footer img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,90,0,.25));margin-bottom:.8rem}
.footer p{color:var(--txt2);font-size:.82rem;margin-bottom:.3rem}
.footer a{color:var(--lava);text-decoration:none;font-size:.82rem;transition:opacity .25s}
.footer a:hover{opacity:.7}

@media(max-width:800px){.header{padding:.8rem 1.2rem}.card,.card:nth-child(even){grid-template-columns:1fr;direction:ltr}.card:nth-child(even)>*{direction:ltr}.card-img{min-height:180px}}
@media(max-width:500px){.logo span{display:none}}
</style>
</head>
<body>

<canvas id="lava"></canvas>
<div class="granite"></div>

<header class="header" id="header">
  <a href="#" class="logo"><img src="logo.jpg" alt="K"><span>КРЕМЕНИАДА</span></a>
  <nav class="nav">
    <a href="#hero">О ПРОЕКТЕ</a>
    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn">RU ▼</button>
      <div class="lang-menu" id="langMenu">
        <button data-lang="en">EN</button>
        <button data-lang="uk">UK</button>
        <button data-lang="ru" class="on">RU</button>
      </div>
    </div>
  </nav>
</header>

<section class="hero" id="hero">
  <img class="hero-banner" id="heroBanner" src="banner.jpg" alt="КРЕМЕНИАДА">
  <h1 class="hero-title" id="heroTitle">КРЕМЕНИАДА</h1>
  <div class="hero-sub1" id="heroSub1">АНАТОМИЯ ОБМАНА</div>
  <div class="hero-sub2" id="heroSub2">ИЛИ КАК НЕ НУЖНО ВОРОВАТЬ</div>
</section>

<section class="season" id="season">
  <div class="season-label">СЕЗОН</div>
  <h2 class="season-title">1 СЕЗОН</h2>
  <div class="cards" id="cards"></div>
</section>

<footer class="footer" id="footer">
  <div class="footer-glow"></div>
  <img src="logo.jpg" alt="K">
  <p>&copy; 2026 КРЕМЕНИАДА</p>
  <p><a href="mailto:bookguks@gmail.com">bookguks@gmail.com</a></p>
</footer>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">Закрыть &times;</button>
    <div class="modal-vid"><iframe id="mFrame" src="" allowfullscreen></iframe></div>
    <div class="modal-info"><h3 id="mTitle"></h3><p id="mDesc"></p></div>
  </div>
</div>

<script>
// THREE.JS LAVA
const cvs=document.getElementById('lava'),ren=new THREE.WebGLRenderer({canvas:cvs,alpha:true,antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scn=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const mat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},uMouse:{value:new THREE.Vector2(.5,.5)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
  fragmentShader:`
    uniform float uTime;uniform vec2 uRes;uniform vec2 uMouse;varying vec2 vUv;
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
    float snoise(vec2 v){
      const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
      vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);
      vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
      vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);
      vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
      vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
      m=m*m;m=m*m;
      vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;
      m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
      vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;
      return 130.0*dot(m,g);
    }
    float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<6;i++){v+=a*snoise(p);a*=0.5;p*=2.0;}return v;}
    void main(){
      vec2 uv=vUv;float ar=uRes.x/uRes.y;uv.x*=ar;
      float t=uTime*0.12;
      float n1=fbm(uv*2.0+vec2(t*0.3,t*0.2));
      float n2=fbm(uv*3.0-vec2(t*0.2,t*0.4)+n1*0.5);
      float n3=fbm(uv*1.5+vec2(t*0.1,t*0.3)+n2*0.3);
      float lava=n1*0.5+n2*0.3+n3*0.2;
      vec2 mouse=uMouse;mouse.x*=ar;
      lava+=smoothstep(0.8,0.0,length(uv-mouse))*0.28;
      vec3 col=mix(vec3(0.03),vec3(0.08,0.06,0.05),smoothstep(-0.5,-0.2,lava));
      col=mix(col,vec3(0.20,0.10,0.05),smoothstep(-0.2,0.0,lava));
      col=mix(col,vec3(0.85,0.22,0.0),smoothstep(0.0,0.2,lava));
      col=mix(col,vec3(1.0,0.50,0.08),smoothstep(0.2,0.45,lava));
      col=mix(col,vec3(1.0,0.82,0.35),smoothstep(0.45,0.7,lava));
      col+=vec3(0.25,0.08,0.0)*smoothstep(0.3,0.7,lava)*0.35;
      float vig=1.0-smoothstep(0.3,1.2,length(vUv-0.5)*1.5);
      col*=0.68+vig*0.32;
      gl_FragColor=vec4(col,1.0);
    }
  `
});
scn.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
let mx=.5,my=.5;
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth;my=1.0-e.clientY/innerHeight;});
function tick(){mat.uniforms.uTime.value+=0.016;mat.uniforms.uMouse.value.x+=(mx-mat.uniforms.uMouse.value.x)*0.025;mat.uniforms.uMouse.value.y+=(my-mat.uniforms.uMouse.value.y)*0.025;ren.render(scn,cam);requestAnimationFrame(tick);}
tick();
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);mat.uniforms.uRes.value.set(innerWidth,innerHeight);});

// GSAP
gsap.registerPlugin(ScrollTrigger);
setTimeout(()=>document.getElementById('header').classList.add('vis'),200);
setTimeout(()=>{document.getElementById('heroBanner').classList.add('vis');document.getElementById('heroTitle').classList.add('vis');document.getElementById('heroSub1').classList.add('vis');document.getElementById('heroSub2').classList.add('vis');},400);
ScrollTrigger.create({start:'top -60',onUpdate:s=>{document.getElementById('header').classList.toggle('scrolled',s.scroll()>60);}});
gsap.to('#lava',{scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:true},y:-150,ease:'none'});
gsap.to('.granite',{scrollTrigger:{trigger:'body',start:'top top',end:'bottom bottom',scrub:true},y:-80,ease:'none'});
gsap.to('#heroBanner',{scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true},y:-60,ease:'none'});
gsap.to('#heroTitle',{scrollTrigger:{trigger:'#hero',start:'top top',end:'bottom top',scrub:true},y:-40,ease:'none'});
gsap.utils.toArray('.season').forEach(el=>gsap.from(el,{scrollTrigger:{trigger:el,start:'top 85%'},opacity:0,y:60,duration:1,ease:'power3.out'}));

// LANG
const lang=document.getElementById('lang'),langBtn=document.getElementById('langBtn'),langMenu=document.getElementById('langMenu');
langBtn.addEventListener('click',e=>{e.stopPropagation();lang.classList.toggle('open');});
document.addEventListener('click',()=>lang.classList.remove('open'));
langMenu.addEventListener('click',e=>e.stopPropagation());
const T={en:{},uk:{},ru:{}};
langMenu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{langBtn.textContent=(b.dataset.lang==='en'?'EN':b.dataset.lang==='uk'?'UK':'RU')+' ▼';langMenu.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));lang.classList.remove('open');}));

// CARDS
const all=[
  {type:'video',title:'Анатомия обмана',desc:'Расследование механизмов манипуляции общественным мнением.',yt:'dQw4w9WgXcQ',date:'15.01.2026',dur:'42 мин'},
  {type:'video',title:'Следы в пепле',desc:'Документальный фильм о событиях, последствия которых мы ощущаем до сих пор.',yt:'dQw4w9WgXcQ',date:'25.03.2026',dur:'38 мин'},
  {type:'audio',title:'Голоса из подполья',desc:'Аудио-расследование: интервью с очевидцами, чьи голоса никогда не звучали в эфире.',audio:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',date:'22.01.2026',dur:'28 мин'},
  {type:'text',title:'Архивы, которые должны были сгореть',desc:'Рассекреченные документы и хронология событий, которые предпочли бы забыть.',date:'01.02.2026',dur:'15 мин чтения'},
  {type:'video',title:'Между строк: правда о договоре',desc:'Разбор документов, которые переписали правила игры.',yt:'dQw4w9WgXcQ',date:'10.03.2026',dur:'55 мин'},
  {type:'video',title:'Новый порядок: что скрывают цифры',desc:'Аналитическое расследование на основе открытых данных.',yt:'dQw4w9WgXcQ',date:'05.05.2026',dur:'48 мин'}
];
function thumb(id){return `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;}
const box=document.getElementById('cards');
box.innerHTML=all.map((c,i)=>{
  const isV=c.type==='video'&&c.yt,isA=c.type==='audio'&&c.audio;
  const play=isV?`<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`:'';
  const click=isV?`onclick="openModal('https://www.youtube.com/embed/${c.yt}','${c.title.replace(/'/g,"\\'")}','${c.desc.replace(/'/g,"\\'")}')"`:'';
  const au=isA?`<audio controls src="${c.audio}"></audio>`:'';
  const img=isV?thumb(c.yt):'banner.jpg';
  return `<div class="card ${c.type}" ${click} style="transition-delay:${i*0.05}s"><div class="card-img"><img src="${img}" alt="${c.title}" loading="lazy">${play}</div><div class="card-body"><div class="card-tag">${c.date} &bull; ${c.dur}</div><h3 class="card-title">${c.title}</h3><p class="card-desc">${c.desc}</p>${au}</div></div>`;
}).join('');
requestAnimationFrame(()=>{document.querySelectorAll('.card').forEach((card,idx)=>{setTimeout(()=>{card.style.opacity='1';card.style.transform='translateY(0)';},idx*100);});});
function openModal(url,t,desc){document.getElementById('mFrame').src=url;document.getElementById('mTitle').textContent=t;document.getElementById('mDesc').textContent=desc;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('mFrame').src='';document.body.style.overflow='';}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
</script>
</body>
</html>
