const grid=document.getElementById('cardsGrid');
const t=i18n[currentLang];
grid.innerHTML=videos.map((v,idx)=>`<article class="card fade-up" onclick="openPlayer(${idx})" tabindex="0" role="button" aria-label="${v.title[currentLang]}"><div class="card-thumb"><img src="https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg" alt="" loading="lazy"><div class="card-play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"></polygon></svg></div></div><div class="card-body"><h3 class="card-title">${v.title[currentLang]}</h3><div class="card-meta"><span>${v.date}</span><span>▶ ${v.views} ${t.viewsLabel}</span></div></div></article>`).join('');
observeElements();
}

/* Бегущая строка — 2 одинаковых блока для бесшовной прокрутки */
function renderMarquee(){
const track=document.getElementById('marqueeTrack');
const items=videos.map(v=>`<span class="marquee-item">${v.title[currentLang]}</span>`).join('<span class="marquee-dot">●</span>');
const content=`<div class="marquee-content">${items}<span class="marquee-dot">●</span></div>`;
track.innerHTML=content+content;
}

function openPlayer(index){
const v=videos[index];
document.getElementById('playerFrame').src=`https://www.youtube.com/embed/${v.videoId}?autoplay=1&rel=0&modestbranding=1`;
document.getElementById('playerTitle').textContent=v.title[currentLang];
document.getElementById('playerDesc').textContent=v.desc[currentLang];
document.getElementById('playerModal').classList.add('active');
document.body.style.overflow='hidden';
}

function closePlayer(e){
if(e&&e.target!==e.currentTarget&&!e.target.closest('.modal-close')&&!e.target.closest('.player-back'))return;
document.getElementById('playerModal').classList.remove('active');
document.getElementById('playerFrame').src='';
document.body.style.overflow='';
}

function openAbout(){
document.getElementById('aboutModal').classList.add('active');
document.body.style.overflow='hidden';
}

function closeAbout(e){
if(e&&e.target!==e.currentTarget&&!e.target.closest('.modal-close'))return;
document.getElementById('aboutModal').classList.remove('active');
document.body.style.overflow='';
}

window.addEventListener('scroll',()=>{
const y=window.pageYOffset;
document.querySelectorAll('.bg-layer').forEach((layer,i)=>{
const speed=.12+(i*.08);
layer.style.transform=`translateY(${y*speed}px) scale(1.1)`;
});
});

function observeElements(){
const obs=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');obs.unobserve(entry.target);}});
},{threshold:.1});
document.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));
}

document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){closePlayer();closeAbout();}});
document.addEventListener('click',(e)=>{if(!e.target.closest('.lang-switch')){document.getElementById('langDropdown').classList.remove('open');}});
document.addEventListener('DOMContentLoaded',()=>{setLang('ru');});
</script>
</body>
</html>
